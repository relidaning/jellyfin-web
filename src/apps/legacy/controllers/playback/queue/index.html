<div id="nowPlayingPage" data-role="page" class="page libraryPage nowPlayingPage noSecondaryNavPage selfBackdropPage" data-title="-">

    <div class="remoteControlContent padded-left padded-right remotePadMode">

        <div class="nowPlayingInfoContainer">
            <div class="nowPlayingPageImageContainer"></div>
            <div class="nowPlayingInfoControls">

                <div class="infoContainer flex">

                    <div class="nowPlayingInfoContainerMedia">
                        <h2 class="nowPlayingPageTitle"></h2>
                        <div style="font-weight: bold;" class="nowPlayingSongName nowPlayingEpisode"></div>
                        <div class="nowPlayingAlbum nowPlayingSeason"></div>
                        <div class="nowPlayingArtist nowPlayingSerie"></div>
                    </div>
                    <div class="nowPlayingPageUserDataButtonsTitle"></div>

                </div>

                <div class="sliderContainer flex" dir="ltr">
                    <div class="positionTime"></div>
                        <div class="nowPlayingPositionSliderContainer">
                            <input type="range" is="emby-slider" pin step="1" min="0" max="100" value="0" class="nowPlayingPositionSlider" data-slider-keep-progress="true" />
                        </div>
                    <div class="runtime"></div>
                </div>

                <div class="nowPlayingButtonsContainer focuscontainer-x justify-content-space-between">

                    <div class="nowPlayingInfoButtons" dir="ltr">

                        <button is="paper-icon-button-light" class="btnCommand btnRepeat repeatToggleButton autoSize" title="${Repeat}"
                            data-command="SetRepeatMode">
                            <span class="material-icons repeat" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnRewind btnNowPlayingRewind btnPlayStateCommand autoSize" title="${Rewind}">
                            <span class="material-icons replay_10" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnPreviousTrack btnPlayStateCommand autoSize" title="${ButtonPreviousTrack}">
                            <span class="material-icons skip_previous" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnPlayPause btnPlayStateCommand autoSize" title="${ButtonPause}">
                            <span class="material-icons pause_circle_filled" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnPlayStateCommand btnStop autoSize" title="${ButtonStop}">
                            <span class="material-icons stop" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnPlayStateCommand btnNextTrack autoSize" title="${ButtonNextTrack}">
                            <span class="material-icons skip_next" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnPlayStateCommand btnFastForward btnNowPlayingFastForward autoSize" title="${FastForward}">
                            <span class="material-icons forward_30" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnShuffleQueue autoSize" title="${Shuffle}">
                            <span class="material-icons shuffle" aria-hidden="true"></span>
                        </button>

                    </div>

                    <div class="nowPlayingSecondaryButtons">

                        <button is="paper-icon-button-light" class="btnAudioTracks videoButton btnPlayStateCommand autoSize" title="${ButtonAudioTracks}" data-command="GoToSearch">
                            <span class="material-icons audiotrack" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnSubtitles videoButton btnPlayStateCommand autoSize" title="${Subtitles}" data-command="GoToSearch">
                            <span class="material-icons closed_caption" aria-hidden="true"></span>
                        </button>

                        <div class="nowPlayingPageUserDataButtons"></div>

                        <button is="paper-icon-button-light" class="btnToggleFullscreen videoButton btnPlayStateCommand autoSize" title="${ButtonFullscreen}" data-command="ToggleFullscreen">
                            <span class="material-icons fullscreen" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnLyrics autoSize hide" title="${Lyrics}">
                            <span class="material-icons lyrics" style="top:0.05em" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnShuffleQueue autoSize" title="${Shuffle}">
                            <span class="material-icons shuffle" aria-hidden="true"></span>
                        </button>

                        <button is="paper-icon-button-light" class="btnCommand btnRepeat repeatToggleButton autoSize" title="${Repeat}"
                            data-command="SetRepeatMode">
                            <span class="material-icons repeat" aria-hidden="true"></span>
                        </button>

                    </div>
                </div>
            </div>
        </div>
        <div class="remotePadBackdrop" aria-hidden="true"></div>
        <div class="remotePad" dir="ltr">
            <div class="remotePadTools">
                <button type="button" class="remotePadPill btnRemotePadSubtitles" title="${Subtitles}" aria-label="${Subtitles}">
                    <span class="material-icons closed_caption" aria-hidden="true"></span>
                    <span class="remotePadLabel">${Subtitles}</span>
                </button>
                <button type="button" class="remotePadPill btnRemotePadAudio" title="${ButtonAudioTracks}" aria-label="${ButtonAudioTracks}">
                    <span class="material-icons audiotrack" aria-hidden="true"></span>
                    <span class="remotePadLabel">${Audio}</span>
                </button>
                <button type="button" class="remotePadPill btnRemotePadFullscreen" title="${ButtonFullscreen}" aria-label="${ButtonFullscreen}">
                    <span class="material-icons fullscreen" aria-hidden="true"></span>
                    <span class="remotePadLabel">${ButtonFullscreen}</span>
                </button>
                <button type="button" class="remotePadPill btnRemotePadStop" title="${ButtonStop}" aria-label="${ButtonStop}">
                    <span class="material-icons stop" aria-hidden="true"></span>
                    <span class="remotePadLabel">${ButtonStop}</span>
                </button>
            </div>

            <div class="remoteRing">
                <svg class="remoteRingSvg" viewBox="-100 -100 200 200" aria-label="Remote buttons">
                    <circle class="remoteRingTrack" r="104" />
                    <circle class="remoteRingArc" r="104" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90)" />
                    <g class="remoteRingButton" data-action="volumeUp" role="button" tabindex="0" aria-label="Volume up">
                        <path d="M -34.00 -91.91 A 98 98 0 0 1 34.00 -91.91 L 13.30 -41.94 A 44 44 0 0 0 -13.30 -41.94 Z" />
                    </g>
                    <g class="remoteRingButton remoteRingCue" data-action="nextSubtitle" role="button" tabindex="0" aria-label="Next subtitle">
                        <path d="M 40.95 -89.03 A 98 98 0 0 1 89.03 -40.95 L 39.06 -20.25 A 44 44 0 0 0 20.25 -39.06 Z" />
                    </g>
                    <g class="remoteRingButton" data-action="fastForward" role="button" tabindex="0" aria-label="Fast-forward">
                        <path d="M 91.91 -34.00 A 98 98 0 0 1 91.91 34.00 L 41.94 13.30 A 44 44 0 0 0 41.94 -13.30 Z" />
                    </g>
                    <g class="remoteRingButton" data-action="nextEpisode" role="button" tabindex="0" aria-label="Next episode">
                        <path d="M 89.03 40.95 A 98 98 0 0 1 40.95 89.03 L 20.25 39.06 A 44 44 0 0 0 39.06 20.25 Z" />
                    </g>
                    <g class="remoteRingButton" data-action="volumeDown" role="button" tabindex="0" aria-label="Volume down">
                        <path d="M 34.00 91.91 A 98 98 0 0 1 -34.00 91.91 L -13.30 41.94 A 44 44 0 0 0 13.30 41.94 Z" />
                    </g>
                    <g class="remoteRingButton" data-action="previousEpisode" role="button" tabindex="0" aria-label="Previous episode">
                        <path d="M -40.95 89.03 A 98 98 0 0 1 -89.03 40.95 L -39.06 20.25 A 44 44 0 0 0 -20.25 39.06 Z" />
                    </g>
                    <g class="remoteRingButton" data-action="rewind" role="button" tabindex="0" aria-label="Rewind">
                        <path d="M -91.91 34.00 A 98 98 0 0 1 -91.91 -34.00 L -41.94 -13.30 A 44 44 0 0 0 -41.94 13.30 Z" />
                    </g>
                    <g class="remoteRingButton remoteRingCue" data-action="previousSubtitle" role="button" tabindex="0" aria-label="Previous subtitle">
                        <path d="M -89.03 -40.95 A 98 98 0 0 1 -40.95 -89.03 L -20.25 -39.06 A 44 44 0 0 0 -39.06 -20.25 Z" />
                    </g>
                    <g class="remoteRingButton remoteRingCue remoteRingCenter" data-action="repeatSubtitle" role="button" tabindex="0" aria-label="Repeat subtitle">
                        <path d="M -2 -35.94 A 36 36 0 0 0 -2 35.94 Z" />
                    </g>
                    <g class="remoteRingButton remoteRingCenter remoteRingPlay" data-action="playPause" role="button" tabindex="0" aria-label="Play/pause">
                        <path d="M 2 -35.94 A 36 36 0 0 1 2 35.94 Z" />
                    </g>
                </svg>
                <span class="remoteRingIcon" data-icon-for="volumeUp" style="left: 50.00%; top: 14.50%;"><span class="material-icons volume_up" aria-hidden="true"></span></span>
                <span class="remoteRingIcon" data-icon-for="nextSubtitle" style="left: 75.10%; top: 24.90%;"><span class="material-icons skip_next" aria-hidden="true"></span><span class="remoteRingBadge" aria-hidden="true">A</span></span>
                <span class="remoteRingIcon" data-icon-for="fastForward" style="left: 85.50%; top: 50.00%;"><span class="material-icons fast_forward" aria-hidden="true"></span></span>
                <span class="remoteRingIcon" data-icon-for="nextEpisode" style="left: 75.10%; top: 75.10%;"><span class="material-icons last_page" aria-hidden="true"></span><span class="remoteRingBadge" aria-hidden="true">EP</span></span>
                <span class="remoteRingIcon" data-icon-for="volumeDown" style="left: 50.00%; top: 85.50%;"><span class="material-icons volume_down" aria-hidden="true"></span></span>
                <span class="remoteRingIcon" data-icon-for="previousEpisode" style="left: 24.90%; top: 75.10%;"><span class="material-icons first_page" aria-hidden="true"></span><span class="remoteRingBadge" aria-hidden="true">EP</span></span>
                <span class="remoteRingIcon" data-icon-for="rewind" style="left: 14.50%; top: 50.00%;"><span class="material-icons fast_rewind" aria-hidden="true"></span></span>
                <span class="remoteRingIcon" data-icon-for="previousSubtitle" style="left: 24.90%; top: 24.90%;"><span class="material-icons skip_previous" aria-hidden="true"></span><span class="remoteRingBadge" aria-hidden="true">A</span></span>
                <span class="remoteRingIcon remoteRingIconCenter" data-icon-for="repeatSubtitle" style="left: 41.50%; top: 50.00%;"><span class="material-icons repeat" aria-hidden="true"></span><span class="remoteRingBadge" aria-hidden="true">A</span></span>
                <div class="remotePadVolumeBubble" aria-live="polite">
                    <span class="material-icons remotePadVolumeIcon volume_up" aria-hidden="true"></span>
                    <span class="remotePadVolumeTrack"><span class="remotePadVolumeFill"></span></span>
                    <span class="remotePadVolumeValue"></span>
                </div>
                <span class="remoteRingIcon remoteRingIconCenter" data-icon-for="playPause" style="left: 58.50%; top: 50.00%;"><span class="material-icons pause" aria-hidden="true"></span></span>
            </div>

            <div class="remotePadExtras">
                <button type="button" class="remotePadPill btnRemotePadShuffle" title="Play something random from this library" aria-label="Play something random from this library">
                    <span class="material-icons shuffle" aria-hidden="true"></span>
                    <span class="remotePadLabel">Random</span>
                </button>
                <button type="button" class="remotePadPill btnRemotePadSettings" title="${Settings}" aria-label="${Settings}">
                    <span class="material-icons tune" aria-hidden="true"></span>
                    <span class="remotePadLabel">${Settings}</span>
                </button>
            </div>

            <div class="remotePadProgress"></div>

            <div class="remotePadAwake">
                <span class="material-icons light_mode" aria-hidden="true"></span>
                Screen stays on · double-tap empty space for the menu bar
            </div>
        </div>
        <div class="remoteControlSection">
            <div class="navigationSection">
                <div is="emby-collapse" title="${HeaderNavigation}">
                    <div class="collapseContent">
                        <div>
                            <button is="paper-icon-button-light" class="btnArrowUp btnCommand autoSize button-submit" title="${Up}" data-command="MoveUp">
                                <span class="material-icons keyboard_arrow_up" aria-hidden="true"></span>
                            </button>
                        </div>
                        <br />
                        <div>
                            <button is="paper-icon-button-light" class="btnArrowLeft btnCommand autoSize button-submit" title="${ButtonArrowLeft}" data-command="MoveLeft">
                                <span class="material-icons keyboard_arrow_left" aria-hidden="true"></span>
                            </button>
                            <button is="paper-icon-button-light" class="btnOk btnCommand autoSize button-submit" title="${ButtonOk}" data-command="Select">
                                <span class="material-icons keyboard_return" aria-hidden="true"></span>
                            </button>
                            <button is="paper-icon-button-light" class="btnArrowRight btnCommand autoSize button-submit" title="${ButtonArrowRight}" data-command="MoveRight">
                                <span class="material-icons keyboard_arrow_right" aria-hidden="true"></span>
                            </button>
                        </div>
                        <br />
                        <div>
                            <button is="paper-icon-button-light" class="btnBack btnCommand autoSize" title="${ButtonBack}" data-command="Back">
                                <span class="material-icons arrow_back" aria-hidden="true"></span>
                            </button>
                            <button is="paper-icon-button-light" class="btnArrowDown btnCommand autoSize button-submit" title="${Down}" data-command="MoveDown">
                                <span class="material-icons keyboard_arrow_down" aria-hidden="true"></span>
                            </button>
                            <button is="paper-icon-button-light" class="btnContextMenu btnCommand autoSize" title="${ButtonInfo}" data-command="ToggleContextMenu">
                                <span class="material-icons menu" aria-hidden="true"></span>
                            </button>
                        </div>
                        <br />
                        <div>
                            <button is="paper-icon-button-light" class="btnGoHome btnCommand autoSize" title="${Home}" data-command="GoHome">
                                <span class="material-icons home" aria-hidden="true"></span>
                            </button>
                            <button is="paper-icon-button-light" class="btnShowSearch btnCommand autoSize" title="${Search}" data-command="GoToSearch">
                                <span class="material-icons search" aria-hidden="true"></span>
                            </button>
                            <button is="paper-icon-button-light" class="bthShowSettings btnCommand autoSize" title="${Settings}" data-command="GoToSettings">
                                <span class="material-icons settings" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sendMessageSection">
                <div is="emby-collapse" title="${HeaderSendMessage}">
                    <div class="collapseContent" style="text-align: left;">
                        <form class="sendMessageForm">
                            <div class="inputContainer">
                                <input is="emby-input" class="sendMessageElement" type="text" id="txtMessageTitle" label="${LabelMessageTitle}" required />
                            </div>
                            <br />
                            <div class="inputContainer">
                                <input is="emby-input" class="sendMessageElement" type="text" id="txtMessageText" label="${LabelMessageText}" required />
                            </div>
                            <p>
                                <button is="emby-button" class="sendMessageElement button-submit block raised" type="submit" raised>${ButtonSend}</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="sendTextSection">
                <div is="emby-collapse" title="${HeaderTypeText}">
                <div  class="collapseContent" style="text-align: left;">
                    <form class="typeTextForm">
                        <div class="inputContainer">
                            <input is="emby-input" class="typeTextElement" type="text" id="txtTypeText" label="${LabelTypeText}" required />
                        </div>
                        <p>
                            <button is="emby-button" class="typeTextElement button-submit block raised" type="submit" raised>${ButtonSend}</button>
                        </p>
                    </form>
                </div>
                </div>
            </div>
        </div>
        <div class="playlistSection">
            <div class="playlistSectionButton flex align-items-center justify-content-center focuscontainer-x">
                <button id="togglePlaylist" is="paper-icon-button-light" class="btnTogglePlaylist hide" title="${ButtonTogglePlaylist}">
                    <span class="material-icons queue_music" aria-hidden="true"></span>
                </button>
                <button is="paper-icon-button-light" class="btnSavePlaylist hide" title="${Save}">
                    <span class="material-icons save" aria-hidden="true"></span>
                </button>
                <button id="toggleContextMenu" is="paper-icon-button-light" class="btnToggleContextMenu" title="${ButtonMore}">
                    <span class="material-icons more_vert" aria-hidden="true"></span>
                </button>
            </div>
            <div id="playlist" class="playlist itemsContainer vertical-list nowPlayingPlaylist hide" is="emby-itemscontainer" data-dragreorder="true"></div>
        </div>
    </div>
</div>
